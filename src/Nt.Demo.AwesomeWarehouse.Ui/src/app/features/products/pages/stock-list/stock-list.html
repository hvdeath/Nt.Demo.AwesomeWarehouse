<section class="main-section">
    <div>
        <a matFab extended aria-label="Example icon button with a delete icon" [routerLink]="['/products/new']">
            <mat-icon>add_box</mat-icon>
            Create product
        </a>
    </div>

    <div class="filter-box">
        <mat-form-field class="full-width">
            <mat-label>Filter by name</mat-label>
            <input matInput placeholder="Ex. Product 1" #input>
        </mat-form-field>
    </div>

    @if(dataSource.loading$ | async) {
    <div class="spinner-container">
        <mat-spinner></mat-spinner>
    </div>
    }
    <table mat-table [dataSource]="dataSource">
        <mat-text-column name="name"></mat-text-column>
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let row" [matTooltip]="row.description"> {{row.description | slice:0:50 }} </td>
        </ng-container>
        <ng-container matColumnDef="unitPrice">
            <th mat-header-cell *matHeaderCellDef>Unit price</th>
            <td mat-cell *matCellDef="let row"> {{row.unitPrice | currency : 'HUF ' }} </td>
        </ng-container>
        <ng-container matColumnDef="unitPriceInEuros">
            <th mat-header-cell *matHeaderCellDef>Unit price (€)</th>
            <td mat-cell *matCellDef="let row"> {{row.unitPriceInEuros | currency : '€ ' }} </td>
        </ng-container>
        <mat-text-column name="weight"></mat-text-column>
        <mat-text-column name="quantity"></mat-text-column>


        <!-- Actions -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>

            <td mat-cell *matCellDef="let row">
                <div class="example-button-row">
                    <button matMiniFab matTooltip="Increase stock" (click)="onIncrease(row)"
                        aria-label="Increase stock">
                        <mat-icon>add</mat-icon>
                    </button>
                    <button matMiniFab matTooltip="Decrease stock" (click)="onDecrease(row)"
                        aria-label="Decrease stock">
                        <mat-icon>remove</mat-icon>
                    </button>
                    <button matMiniFab matTooltip="Edit product" [routerLink]="['/products/edit', row.id]"
                        aria-label="Edit product">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button matMiniFab matTooltip="Delete product" (click)="onDelete(row)" aria-label="Delete product">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
        <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
    </table>

    <mat-paginator [length]="dataSource.countSubject$ | async" [pageSize]="10"
        [pageSizeOptions]="[10, 25, 50]"></mat-paginator>
    <router-outlet></router-outlet>
</section>
