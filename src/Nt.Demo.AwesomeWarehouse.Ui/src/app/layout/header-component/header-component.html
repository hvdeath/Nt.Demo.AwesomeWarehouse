<mat-toolbar class="app-toolbar">
  <div class="toolbar-inner">
    <a class="brand" [routerLink]="['/']">
      <span class="brand-mark"><mat-icon>build_circle</mat-icon></span>
      <span>Awesome Warehouse</span>
    </a>

    <span class="spacer"></span>

    <nav class="nav-actions" aria-label="Main navigation">
      <a mat-button [routerLink]="['/']" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a mat-button [routerLink]="['/products']" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Products</a>
      <a mat-button [routerLink]="['/reports']" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">Reports</a>
    </nav>
  </div>
</mat-toolbar>
<mat-divider />
